name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'إنشاء إصدار على GitHub Release؟'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'اسم الإصدار (مثال: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Detect release signing secrets
        id: release_signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require signing secrets for a release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        env:
          SIGNING_CONFIGURED: ${{ steps.release_signing.outputs.configured }}
        shell: bash
        run: |
          if [[ "$SIGNING_CONFIGURED" != "true" ]]; then
            echo "::error::Configure a rotated upload key in GitHub Actions Secrets before creating a release."
            exit 1
          fi

      - name: Restore rotated release keystore
        id: prepare_keystore
        if: ${{ steps.release_signing.outputs.configured == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release-upload-key.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build signed Release APK
        if: ${{ steps.release_signing.outputs.configured == 'true' }}
        env:
          KEYSTORE_PATH: ${{ steps.prepare_keystore.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p output-apks
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          cp "$DEBUG_APK" output-apks/SafePlayer-debug.apk
          RELEASE_APK=""
          if [[ -d app/build/outputs/apk/release ]]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          fi
          if [[ -n "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" output-apks/SafePlayer-release.apk
          fi
          ls -lh output-apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: SafePlayer-APKs
          path: output-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            SafePlayer APKs built by GitHub Actions.
            Release signing requires a rotated keystore stored in GitHub Actions Secrets.
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
