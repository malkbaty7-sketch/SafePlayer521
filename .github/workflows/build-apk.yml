name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'إنشاء إصدار على GitHub Release؟'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'اسم الإصدار (مثال: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Secrets & Keystores
        run: |
          echo "Preparing environment and keystores..."
          # Prepare .env for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Restore debug.keystore from base64 if present, or generate one
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # Restore or generate my-upload-key.jks for release signing
          if [ ! -f "my-upload-key.jks" ]; then
            if [ -f "my-upload-key.jks.base64" ]; then
              echo "Restoring my-upload-key.jks from base64..."
              base64 -d my-upload-key.jks.base64 > my-upload-key.jks
            else
              echo "Generating my-upload-key.jks..."
              keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SafePlayer, OU=AI, O=SafePlayer, L=City, S=State, C=US"
            fi
          fi

      - name: Build Debug APK
        run: |
          echo "Building Debug APK..."
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: |
          echo "Building Release APK..."
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect and Rename APKs
        run: |
          mkdir -p output-apks
          VERSION_NAME="1.0.0"

          echo "Searching for all built APK files..."
          find app/build/outputs/ -type f -name "*.apk" || true

          # Collect Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/SafePlayer-v${VERSION_NAME}-debug.apk"
            echo "Copied Debug APK from $DEBUG_APK"
          fi

          # Collect Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/SafePlayer-v${VERSION_NAME}-release.apk"
            echo "Copied Release APK from $RELEASE_APK"
          fi

          # Fallback: copy any APK found in outputs if not already copied
          for apk in $(find app/build/outputs -name "*.apk" 2>/dev/null); do
            bname=$(basename "$apk")
            if [ ! -f "output-apks/$bname" ] && [ ! -f "output-apks/SafePlayer-v${VERSION_NAME}-release.apk" ]; then
              cp "$apk" "output-apks/$bname"
            fi
          done

          echo "Final APK files generated:"
          ls -lh output-apks/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafePlayer-APKs
          path: output-apks/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## 📱 مشغل SafePlayer - ملفات التثبيت (APK)
            
            تم بناء ملفات التطبيق بنجاح:
            - **SafePlayer-v1.0.0-release.apk**: النسخة الجاهزة للتشغيل والاستخدام اليومي.
            - **SafePlayer-v1.0.0-debug.apk**: النسخة التجريبية للمطورين.
            
            ### ✨ أهم المميزات المضمنة:
            - 🔐 **الخزنة السرية (Safe Vault Pro)**: حماية بالبصمة ورمز PIN، ووضع التمويه الذكي (Decoy PIN).
            - 📺 **بث Wi-Fi و IPTV المباشر**: تشغيل روابط M3U8/HLS و RTSP، استيراد قوائم M3U، وقنوات إخبارية ووثائقية مسبقة التجهيز.
            - 🌐 **خادم النقل والمشاركة عبر Wi-Fi**: بث الفيديوهات ونقل الملفات من الكمبيوتر للموبايل عبر المتصفح دون كابلات.
            - 🎵 **مستخرج الصوت فائق السرعة**: تحويل الفيديو إلى ملف صوتي نقي M4A بدون إعادة تشفير وحفظه في المكتبة.
            - 🗜️ **ضاغط الفيديو الذكي**: تقليص حجم الفيديو (1080p, 720p, 480p) لتوفير المساحة وسهولة المشاركة.
            - 🌐 **مركز الترجمة الذكي**: بحث وتحميل الترجمات أونلاين وتخصيص الخطوط العربية (نسخ، رقعة، عريض) ومزامنة التوقيت.
            - 📊 **إحصائيات المشاهدة والإشارات المرجعية**: حفظ لقطات مرجعية بنقرة زر وتتبع إجمالي ساعات المشاهدة ونسبة الإنجاز.
            - 🎚️ **موازن صوت 5-Band Equalizer**: تضخيم الباس (Bass Boost) ومضاعفة الصوت (Loudness Boost).
            - 📸 **لقطة شاشة فورية**: حفظ لقطة بدقة عالية من أي إطار فيديو مباشرة في المعرض.
            - 🎨 **فلاتر الفيديو المباشرة**: سينما HDR، حماية العين، وأبيض وأسود.
            - 🛡️ **الحارس العائلي الذكي**: تخطي وكتم وتعتيم المشاهد الحساسة تلقائياً.
            - ⏰ **مؤقت النوم الذكي**: مع عد تنازلي حي وإمكانية التمديد.
            - 📱 **مشغل مصغر ونافذة عائمة (PiP)**: تشغيل في الخلفية وتكبير باللمس (Pinch-to-zoom).
          files: output-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
